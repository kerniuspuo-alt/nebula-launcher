[package]
name = "nebula-launcher"
version = "0.1.0"
description = "Nebula — official-auth Minecraft launcher"
authors = ["Nebula"]
edition = "2021"

[lib]
name = "nebula_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
sysinfo = "0.33"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
zip = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
urlencoding = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
[profile.release]
codegen-units = 8
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
